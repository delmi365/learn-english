<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>阿坝高三英语冲刺 · 本科上岸</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#ffffff; --ink:#1e293b; --sub:#64748b; --line:#e2e8f0;
    --blue:#2563eb; --blue-l:#dbeafe; --amber:#d97706; --amber-l:#fef3c7;
    --green:#059669; --green-l:#d1fae5; --red:#dc2626; --red-l:#fee2e2;
    --purple:#7c3aed; --purple-l:#ede9fe;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{
    font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
    background:var(--bg); color:var(--ink); font-size:15px; line-height:1.6;
  }
  .wrap{max-width:880px; margin:0 auto; padding:0 12px 80px;}
  /* ---------- header ---------- */
  header.top{
    background:linear-gradient(135deg,#1d4ed8 0%,#2563eb 55%,#3b82f6 100%);
    color:#fff; padding:14px 16px 12px; position:sticky; top:0; z-index:50;
    box-shadow:0 2px 12px rgba(30,64,175,.25);
  }
  .top-row{max-width:880px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
  .brand{font-size:17px; font-weight:700; letter-spacing:.5px;}
  .brand small{display:block; font-size:11px; font-weight:400; opacity:.85;}
  .countdown{background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.35); border-radius:12px; padding:6px 14px; text-align:center;}
  .countdown b{font-size:24px; display:block; line-height:1.1;}
  .countdown span{font-size:11px; opacity:.9;}
  /* ---------- nav ---------- */
  nav.tabs{
    position:sticky; top:0; z-index:49; background:var(--bg);
    display:flex; gap:8px; overflow-x:auto; padding:10px 12px; max-width:880px; margin:0 auto;
    scrollbar-width:none;
  }
  nav.tabs::-webkit-scrollbar{display:none;}
  nav.tabs button{
    flex:0 0 auto; border:1px solid var(--line); background:#fff; color:var(--sub);
    padding:7px 14px; border-radius:999px; font-size:14px; cursor:pointer; white-space:nowrap;
    transition:all .15s;
  }
  nav.tabs button.active{background:var(--blue); border-color:var(--blue); color:#fff; font-weight:600;}
  /* ---------- cards ---------- */
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-top:14px; box-shadow:0 1px 3px rgba(15,23,42,.04);}
  .card h2{font-size:16px; margin-bottom:10px; display:flex; align-items:center; gap:8px;}
  .card h3{font-size:14px; margin:14px 0 8px; color:var(--ink);}
  .muted{color:var(--sub); font-size:13px;}
  .btn{
    display:inline-flex; align-items:center; gap:6px; border:none; border-radius:10px;
    padding:9px 16px; font-size:14px; cursor:pointer; background:var(--blue); color:#fff; font-weight:600;
  }
  .btn:active{transform:scale(.97);}
  .btn.ghost{background:#fff; color:var(--blue); border:1px solid var(--blue);}
  .btn.warn{background:var(--amber);}
  .btn.gray{background:#f1f5f9; color:var(--sub);}
  .btn.green{background:var(--green);}
  .btn.sm{padding:5px 10px; font-size:12.5px; border-radius:8px;}
  .btn[disabled]{opacity:.5; pointer-events:none;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  @media(max-width:560px){ .grid3{grid-template-columns:repeat(2,1fr);} }
  .stat{background:#f8fafc; border:1px solid var(--line); border-radius:12px; padding:10px 12px;}
  .stat b{font-size:20px; color:var(--blue); display:block; line-height:1.2;}
  .stat span{font-size:12px; color:var(--sub);}
  .pbar{height:8px; background:#e2e8f0; border-radius:99px; overflow:hidden; margin-top:6px;}
  .pbar i{display:block; height:100%; background:linear-gradient(90deg,#3b82f6,#2563eb); border-radius:99px;}
  table.tbl{width:100%; border-collapse:collapse; font-size:13px; margin-top:6px;}
  table.tbl th{background:#f1f5f9; text-align:left; padding:7px 8px; border:1px solid var(--line); white-space:nowrap;}
  table.tbl td{padding:7px 8px; border:1px solid var(--line); vertical-align:top;}
  .tag{display:inline-block; font-size:11.5px; padding:1px 8px; border-radius:99px; font-weight:600;}
  .tag.b{background:var(--blue-l); color:var(--blue);}
  .tag.g{background:var(--green-l); color:var(--green);}
  .tag.a{background:var(--amber-l); color:var(--amber);}
  .tag.r{background:var(--red-l); color:var(--red);}
  .tag.p{background:var(--purple-l); color:var(--purple);}
  /* ---------- flashcards ---------- */
  .flash{perspective:1200px; margin-top:6px;}
  .flash-inner{position:relative; min-height:230px; transition:transform .35s; transform-style:preserve-3d; cursor:pointer;}
  .flash.flipped .flash-inner{transform:rotateY(180deg);}
  .face{position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
    background:#fff; border:1px solid var(--line); border-radius:16px; padding:22px 18px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:8px;}
  .face.back{transform:rotateY(180deg); background:#f8faff; border-color:#bfdbfe;}
  .face .word{font-size:28px; font-weight:700; color:var(--blue); letter-spacing:.5px;}
  .face .ph{color:var(--sub); font-size:14px;}
  .face .mean{font-size:18px; font-weight:700;}
  .face .ex{font-size:14px; color:var(--ink); background:#fff; border:1px dashed var(--line); border-radius:8px; padding:6px 10px; width:100%;}
  .face .exc{font-size:12.5px; color:var(--sub);}
  .face .tip{font-size:12.5px; color:var(--amber);}
  /* ---------- study card (word + meaning + 2 examples) ---------- */
  .sc{border:2px solid var(--blue); border-radius:16px; padding:14px 14px 12px; margin-top:6px;
      background:linear-gradient(180deg,#f8faff,#fff);}
  .sc .word{font-size:32px; font-weight:800; color:var(--blue); text-align:center; letter-spacing:.5px;}
  .sc .ph{color:var(--sub); text-align:center; font-size:14px; margin-top:2px;}
  .sc .spk-row{display:flex; justify-content:center; margin-top:8px;}
  .sc .mean-box{margin-top:10px; background:#fffbeb; border:1px solid #fde68a; border-radius:10px; padding:8px 12px;
      font-size:17px; font-weight:700; display:flex; align-items:center; gap:8px;}
  .sc .mean-box .lab{font-size:12px; font-weight:700; color:#b45309; background:#fef3c7; border-radius:6px; padding:2px 6px; flex:none;}
  .sc-ex{margin-top:8px; background:#fff; border:1px dashed var(--line); border-radius:10px; padding:8px 12px; font-size:14px;}
  .sc-ex.alt{background:#f0fdf4; border:1px solid #bbf7d0;}
  .sc-ex-head{display:flex; justify-content:space-between; align-items:center; gap:8px;}
  .sc-ex-lab{font-size:11px; font-weight:700; color:var(--sub); background:var(--blue-l); border-radius:6px; padding:1px 6px; flex:none;}
  .sc-ex.alt .sc-ex-lab{background:#dcfce7; color:#15803d;}
  .sc-ex-en{font-weight:600; line-height:1.5;}
  .sc-ex-zh{color:var(--sub); font-size:12.5px; margin-top:2px;}
  .sc .tip{margin-top:8px; font-size:12.5px; color:var(--amber);}
  /* ---------- word list item ---------- */
  .wli{border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-top:10px; background:#fff;}
  .wli-head{display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap;}
  .wli-w{font-size:19px; color:var(--blue);}
  .wli-ph{color:var(--sub); font-size:12.5px; margin:0 6px;}
  .wli-m{font-weight:700; font-size:14.5px;}
  .wli-kp{margin-top:6px; font-size:12.5px; color:var(--amber); background:#fffbeb; border:1px dashed #fde68a; border-radius:8px; padding:5px 10px;}
  /* ---------- 真题考场 ---------- */
  .chip{border:1px solid var(--line); background:#fff; color:var(--sub); border-radius:99px; padding:5px 14px; font-size:13px; cursor:pointer; font-weight:600;}
  .chip.on{background:var(--blue); border-color:var(--blue); color:#fff;}
  .tag.p{background:#f3e8ff; color:#7e22ce;}
  .pq{border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-top:10px; background:#fff;}
  .pq-h{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .pq-kp{font-size:11px; font-weight:700; color:#7e22ce; background:#f3e8ff; border-radius:6px; padding:1px 7px;}
  .pq-q{font-size:15px; font-weight:600; line-height:1.6; margin:8px 0 10px;}
  .pq-opts{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .opt{border:1px solid var(--line); background:#fff; border-radius:10px; padding:8px 10px; font-size:13.5px; cursor:pointer; text-align:left; line-height:1.4;}
  .opt:hover{border-color:var(--blue);}
  .opt.sel{border-color:var(--blue); background:var(--blue-l); color:var(--blue); font-weight:700;}
  .opt.ok{border-color:var(--green); background:#f0fdf4; color:#15803d; font-weight:700;}
  .opt.no{border-color:var(--red); background:#fef2f2; color:var(--red); font-weight:700;}
  .fill{width:100%; border:1px solid var(--line); border-radius:10px; padding:9px 12px; font-size:15px; font-family:inherit;}
  .fill:focus{outline:none; border-color:var(--blue); background:var(--blue-l);}
  .pq-exp{margin-top:8px; font-size:13px; line-height:1.6; background:#f0fdf4; border:1px solid #bbf7d0; border-radius:8px; padding:7px 10px; color:#166534;}
  .pq-exp.no{background:#fef2f2; border-color:#fecaca; color:#991b1b;}
  .pq-passage{font-size:14.5px; line-height:1.9; color:var(--ink); background:#f8fafc; border:1px solid var(--line); border-radius:8px; padding:10px 12px;}
  .pq-req{font-size:14.5px; line-height:1.7; background:#f8fafc; border:1px solid var(--line); border-radius:8px; padding:10px 12px;}
  .pq-tip{font-size:13px; color:var(--sub); line-height:1.6; margin-top:4px;}
  @media (max-width:560px){ .pq-opts{grid-template-columns:1fr;} }
  .spk{background:var(--blue-l); color:var(--blue); border:none; border-radius:99px; padding:5px 14px; font-size:13px; cursor:pointer; font-weight:600;}
  .spk.sm{padding:3px 10px; font-size:12px;}
  .study-actions{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:12px;}
  .word-list{max-height:300px; overflow:auto; margin-top:8px;}
  .word-row{display:flex; justify-content:space-between; align-items:center; gap:8px; padding:8px 4px; border-bottom:1px dashed var(--line); font-size:14px;}
  .word-row .l b{color:var(--blue);}
  .word-row .l span{color:var(--sub); font-size:12.5px; margin-left:8px;}
  /* ---------- quiz ---------- */
  .q-box{background:#f8fafc; border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-top:10px;}
  .q-box .qt{font-weight:600; margin-bottom:8px;}
  .opt{display:block; width:100%; text-align:left; background:#fff; border:1px solid var(--line); border-radius:10px; padding:9px 12px; margin-top:6px; cursor:pointer; font-size:14px; transition:all .12s;}
  .opt:hover{border-color:var(--blue);}
  .opt.correct{background:var(--green-l); border-color:var(--green); color:#065f46; font-weight:600;}
  .opt.wrong{background:var(--red-l); border-color:var(--red); color:#991b1b;}
  .explain{display:none; margin-top:8px; background:#fffbeb; border:1px solid #fde68a; border-radius:10px; padding:8px 12px; font-size:13px; color:#78350f;}
  .opt.done{pointer-events:none;}
  /* ---------- reading ---------- */
  .passage{font-size:14.5px; line-height:1.9;}
  .passage p{margin-bottom:10px; text-align:justify;}
  .blank-chip{display:inline-block; min-width:34px; border-bottom:2px solid var(--blue); color:var(--blue); text-align:center; margin:0 2px; font-weight:700;}
  .opts-row{display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 12px;}
  .seven-opt{background:#fff; border:1px solid var(--blue); color:var(--blue); border-radius:8px; padding:5px 12px; cursor:pointer; font-size:13.5px;}
  .seven-opt.used{opacity:.35; pointer-events:none;}
  .seven-opt.picked{border-color:var(--green); color:var(--green);}
  /* ---------- timeline ---------- */
  .tl{border-left:3px solid var(--blue-l); margin-left:8px; padding-left:16px;}
  .tl-item{position:relative; margin-bottom:14px;}
  .tl-item::before{content:""; position:absolute; left:-23px; top:5px; width:11px; height:11px; border-radius:50%; background:var(--blue); border:2px solid #fff; box-shadow:0 0 0 2px var(--blue-l);}
  .tl-item b{color:var(--blue);}
  .tl-item .d{font-size:12.5px; color:var(--sub); display:block; margin-bottom:2px;}
  /* ---------- misc ---------- */
  a{color:var(--blue); text-decoration:none;}
  a:hover{text-decoration:underline;}
  .res{display:block; border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-top:8px; background:#fff;}
  .res:hover{border-color:var(--blue); text-decoration:none;}
  .res b{font-size:14px;}
  .res .d{font-size:12.5px; color:var(--sub); margin-top:2px;}
  .input{width:100%; border:1px solid var(--line); border-radius:10px; padding:9px 12px; font-size:15px; margin-top:6px;}
  .hl{background:linear-gradient(transparent 62%, #fde68a 62%); font-weight:600;}
  .notice{border-radius:12px; padding:12px 14px; margin-top:12px; font-size:13.5px;}
  .notice.warn{background:#fffbeb; border:1px solid #fcd34d; color:#78350f;}
  .notice.info{background:#eff6ff; border:1px solid #bfdbfe; color:#1e3a8a;}
  .footer{max-width:880px; margin:18px auto 0; padding:0 14px; font-size:12px; color:var(--sub); text-align:center;}
  .unit-item{display:flex; justify-content:space-between; align-items:center; width:100%; background:#fff; border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-top:8px; cursor:pointer; text-align:left;}
  .unit-item:hover{border-color:var(--blue);}
  .unit-item-main{display:flex; justify-content:space-between; align-items:center; gap:10px; flex:1; background:none; border:none; padding:0; margin:0; font:inherit; color:inherit; text-align:left; cursor:pointer;}
  .unit-item .meta{font-size:12.5px; color:var(--sub);}
  .g-item{display:flex; gap:10px; align-items:flex-start; width:100%; background:#fff; border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-top:8px; cursor:pointer; text-align:left;}
  .g-item:hover{border-color:var(--blue);}
  .g-item .n{flex:0 0 26px; height:26px; border-radius:50%; background:var(--blue); color:#fff; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700;}
  .g-item .n.done{background:var(--green);}
  .r-item{display:block; width:100%; background:#fff; border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-top:8px; cursor:pointer; text-align:left;}
  .r-item:hover{border-color:var(--blue);}
  .r-item .row2{display:flex; gap:6px; margin-top:5px; flex-wrap:wrap; align-items:center;}
  .tpl{background:#fff; border:1px solid var(--line); border-left:4px solid var(--green); border-radius:10px; padding:10px 12px; margin-top:8px; font-size:14px;}
  .tpl .en{font-weight:600;}
  .tpl .cn{font-size:12.5px; color:var(--sub); margin-top:2px;}
</style>
</head>

  <div class="top-row">
    <div class="brand">🎓 阿坝高三英语冲刺<small>背单词 · 学语法 · 读短文 · 冲本科</small></div>

{name:"第1章 · 句子结构五大基本句型",goal:"读懂长难句的骨架，一切语法的基础",html:`
<p>英语句子千变万化，都逃不出这五个句型。拿到长句，先找<b>动词</b>，再问一句“动词后面跟了什么”：</p>
<table class="tbl">
<tr><th>句型</th><th>结构</th><th>例子</th></tr>
<tr><td>①主谓</td><td>S + V（不及物）</td><td>Birds <b>fly</b>.</td></tr>
<tr><td>②主谓宾</td><td>S + V + O</td><td>I <b>love</b> English.</td></tr>
<tr><td>③主系表</td><td>S + 系动词 + P</td><td>She <b>is</b> confident.</td></tr>
<tr><td>④主谓双宾</td><td>S + V + 人 + 物</td><td>He gave <b>me</b> <b>a book</b>.</td></tr>
<tr><td>⑤主谓宾补</td><td>S + V + O + C</td><td>We call <b>him</b> Tom.</td></tr>
</table>
<h3>句子成分快速判断法</h3>
<p>1. 主语 = 句子的“话题”，常在句首；<b>2. 谓语 = 动词（或动词短语）</b>，一个简单句只有一个核心动词；3. 宾语 = 动作的“承受者”，在动词后；4. 表语 = 系动词后的身份/状态；5. 补语 = 补充说明宾语的状态（常由形容词/to do/doing 担任）。</p>
<div class="notice info">读长句诀窍：先删掉修饰成分（形容词、介词短语、从句），只剩“谁+做了什么”，主干立刻现形。</div>`,

{name:"第2章 · 动词时态（16时态速查+标志词）",goal:"高考语法填空、完形第一大考点",html:`
<h3>八大时间 × 四种状态，先记最常考的8种</h3>
<table class="tbl">
<tr><th>时态</th><th>构成</th><th>标志词</th></tr>
<tr><td>一般现在时</td><td>do / does</td><td>often, usually, always, 客观真理</td></tr>
<tr><td>一般过去时</td><td>did</td><td>yesterday, last week, in 2010, ago</td></tr>
<tr><td>一般将来时</td><td>will do / be going to</td><td>tomorrow, next year, in 2027</td></tr>
<tr><td>现在进行时</td><td>am/is/are doing</td><td>now, look, listen, these days</td></tr>
<tr><td>过去进行时</td><td>was/were doing</td><td>at 8 last night, this time yesterday</td></tr>
<tr><td>现在完成时</td><td>have/has done</td><td>already, yet, just, ever, so far, since/for</td></tr>
<tr><td>过去完成时</td><td>had done</td><td>by the time..., by the end of last term</td></tr>
<tr><td>将来完成时</td><td>will have done</td><td>by the time + 将来时间</td></tr>
</table>
<h3>三大高频陷阱（记熟！）</h3>
<p>1. <b>since / for</b>：主句用<b>现在完成时</b>，since 后接<b>过去时间点</b>，for 后接<b>一段时间</b>。<br>
2. <b>by the time + 过去从句</b> → 主句用<b>过去完成时</b>（过去的过去）。<br>
3. <b>It is/has been + 时间段 + since</b> 从句用一般过去时。</p>
<div class="notice warn">没有时间状语时，看上下文：一个动作“对现在造成影响”用现在完成时；两个过去动作有先后，先发生的用过去完成时。</div>`,

{name:"第3章 · 被动语态",goal:"语法填空、单选常客：be+done 和各种特殊被动",html:`
<h3>基本结构：be + 过去分词（done）</h3>
<table class="tbl">
<tr><th>时态</th><th>被动</th></tr>
<tr><td>一般现在</td><td>am/is/are done</td></tr>
<tr><td>一般过去</td><td>was/were done</td></tr>
<tr><td>现在完成</td><td>have/has been done</td></tr>
<tr><td>一般将来</td><td>will be done / be going to be done</td></tr>
<tr><td>进行</td><td>am/is/are being done</td></tr>
<tr><td>含情态</td><td>can/must/should be done</td></tr>
</table>
<h3>高考三个热点</h3>
<p>1. <b>双宾语变被动</b>：give sb sth → sb is given sth 或 sth is given to sb。<br>
2. <b>感官/使役动词</b>：see sb do → sb be seen to do（省略的to要还原）。<br>
3. <b>不用被动的动词</b>：happen, take place, break out, appear, disappear, belong to, consist of（不及物/无被动）。</p>
<div class="notice info">“主动表被动”也常考：The book sells well.（这种书卖得好）— sell/wash/write/read + well 主动形式表被动含义。</div>`,

{name:"第4章 · 定语从句",goal:"考点：that/which/who/关系副词，完形阅读长难句必备",html:`
<h3>第一步：看先行词是人还是物；第二步：看从句缺什么成分</h3>
<table class="tbl">
<tr><th>从句缺什么</th><th>人</th><th>物</th></tr>
<tr><td>缺主语/宾语</td><td>who / whom / that</td><td>which / that</td></tr>
<tr><td>缺定语（...的）</td><td colspan="2">whose</td></tr>
<tr><td>缺地点状语</td><td colspan="2">where（= in which）</td></tr>
<tr><td>缺时间状语</td><td colspan="2">when</td></tr>
<tr><td>缺原因状语</td><td colspan="2">why</td></tr>
</table>
<h3>只用 that 的情况（口诀）</h3>
<p>先行词被<b>序数词/最高级/the only/the very/all/every/no/any</b>修饰；先行词<b>有人又有物</b>；不定代词（all, everything, nothing, something）作先行词。</p>
<h3>不用 that 的情况</h3>
<p>非限制性定语从句（有逗号）；介词后面（in which）。</p>
<div class="notice warn">易错：This is the school ___ I studied ten years ago.（where，从句主谓完整，缺地点状语）；This is the school ___ I visited last week.（which/that，从句缺宾语）</div>`,
quiz:[
{q:"The book ___ I bought yesterday is very useful.",o:["who","what","which","where"],a:2,ex:"先行词 book 是物；从句 I bought ___ 缺宾语，指物用 which/that。"},
{q:"I still remember the day ___ we spent together in Aba.",o:["when","which","on which","where"],a:1,ex:"从句 we spent ___，spent 是及物动词缺宾语 → 用 which（spent the day together）。when 是做状语的（on the day）。"},
{q:"He is the only student ___ passed the exam.",o:["who","which","whom","whose"],a:0,ex:"先行词被 the only 修饰，关系词只用 that；且从句缺主语指人。四个选项中最合适为 who（口语中可用，严格应试优先 that，本题选项无 that 则选 who）。"},
{q:"The village ___ we visited last summer has changed a lot.",o:["where","in which","which","that"],a:2,ex:"从句 we visited ___ 缺宾语，指物用 which/that。where 是关系副词（从句主谓必须完整）。"},
]},
{name:"第5章 · 名词性从句",goal:"主语/宾语/表语/同位语从句：that/what/whether三分",html:`
<h3>四类名词性从句</h3>
<p>主语从句（句首）、宾语从句（动词/介词后）、表语从句（系动词后）、同位语从句（fact/news/idea 后解释内容）。</p>
<h3>连接词怎么选</h3>
<table class="tbl">
<tr><th>连接词</th><th>用法</th><th>例句</th></tr>
<tr><td><b>that</b></td><td>陈述事实，从句不充当成分</td><td>I think that he is right.</td></tr>
<tr><td><b>whether/if</b></td><td>“是否”</td><td>I wonder if he will come.</td></tr>
<tr><td><b>what</b></td><td>“所…的东西”，从句缺主语/宾语</td><td>What we need is time.</td></tr>
<tr><td>who/which/when/where/why/how</td><td>保留疑问词意思</td><td>When he comes is unknown.</td></tr>
</table>
<h3>高考三大陷阱</h3>
<p>1. <b>宾语从句用陈述语序</b>：Could you tell me where the station is?（不能说 where is the station）<br>
2. <b>what  vs that</b>：What he said is true.（what 在从句中作 said 的宾语）/ That he said so is true.（that 只连接，不作成分）。<br>
3. <b>whether 不能用 if 替换</b>：介词后、不定式前（whether to go）、whether or not 连用。</p>
<div class="notice info">同位语从句 vs 定语从句：The news that he told us is exciting.（定从，that作宾语）/ The news that he won is exciting.（同位语，that不充当成分）。</div>`,
quiz:[
{q:"___ is clear is that he has made a mistake.",o:["It","What","That","Which"],a:1,ex:"What is clear 是主语从句，what 在从句中作主语（is clear 缺主语）。It is clear that... 才是形式主语句型。"},
{q:"Could you tell me ___?",o:["where is the post office","where the post office is","where was the post office","where the post office was"],a:1,ex:"宾语从句用陈述语序（主语+谓语），且问现在的情况，选 where the post office is。"},
{q:"The teacher was happy with ___ we had done.",o:["that","what","which","whether"],a:1,ex:"with 后面是宾语从句，从句 we had done 缺宾语，用 what（我们所做的）。"},
{q:"We haven't decided ___ to spend the weekend.",o:["that","what","whether","if"],a:2,ex:"whether to do 是固定搭配（if 不能用于不定式前），表示“是否去”。"},
]},
{name:"第6章 · 状语从句",goal:"九大状语从句的引导词与陷阱",html:`
<table class="tbl">
<tr><th>类型</th><th>引导词</th></tr>
<tr><td>时间</td><td>when/while/as/before/after/since/until/hardly...when/no sooner...than/the moment</td></tr>
<tr><td>条件</td><td>if/unless/as long as/once（一旦）</td></tr>
<tr><td>原因</td><td>because/since/as/now that</td></tr>
<tr><td>让步</td><td>although/though/even if/while/no matter + 疑问词</td></tr>
<tr><td>目的</td><td>so that/in order that/in case（以防）</td></tr>
<tr><td>结果</td><td>so...that/such...that</td></tr>
<tr><td>比较</td><td>as...as/not so...as/than</td></tr>
<tr><td>地点</td><td>where</td></tr>
<tr><td>方式</td><td>as（像…一样）</td></tr>
</table>
<h3>高考高频陷阱</h3>
<p>1. <b>although 不能和 but 连用</b>（同理 though...yet 除外）。<br>
2. <b>not...until</b>：He did not go to bed until 11.<br>
3. <b>Hardly had he...when</b> / No sooner had he...than 倒装。<br>
4. <b>once/as long as</b> 引导条件从句，主将从现（主句将来时，从句一般现在时）。</p>`,
quiz:[
{q:"___ he was tired, he kept working on the farm.",o:["Although","But","Because","So"],a:0,ex:"“累”和“坚持干”是让步关系，用 Although；although 不能与 but 同时出现。"},
{q:"I will not go to the party ___ I am invited.",o:["if","unless","since","though"],a:1,ex:"unless = if not。“除非被邀请，否则不去”。if 代入意思反了。"},
{q:"___ had I entered the room ___ the phone rang.",o:["Hardly; when","No sooner; than","Hardly; than","No sooner; when"],a:0,ex:"固定搭配 Hardly...when / No sooner...than（“一…就…”），且主句倒装 had I entered。"},
{q:"Speak loudly ___ everyone can hear you clearly.",o:["so that","such that","in order to","because"],a:0,ex:"so that “以便”，后面接从句 everyone can hear；in order to 后接动词原形。"},
]},
{name:"第7章 · 非谓语动词",goal:"语法填空半壁江山：to do / doing / done",html:`
<h3>判断三步法</h3>
<p>① 找到逻辑主语（非谓语的动作是谁发出的）② 判断<b>主动/被动</b> ③ 判断<b>时间先后</b>。</p>
<table class="tbl">
<tr><th>形式</th><th>含义</th></tr>
<tr><td><b>to do</b></td><td>将来、目的、具体的某次</td></tr>
<tr><td><b>doing</b></td><td>主动、进行、习惯性</td></tr>
<tr><td><b>done</b></td><td>被动、完成</td></tr>
</table>
<h3>必须背的高频搭配</h3>
<p>can't help doing忍不住；look forward to doing期待；be used to doing习惯于；it's no use doing 没用；have difficulty (in) doing 做…有困难；spend time (in) doing 花时间做；avoid/consider/enjoy/mind/finish/practice/suggest + doing；make sb do / make sb doing？— make sb do（省略to）但被动还原：be made to do。</p>
<h3>with 复合结构 / 独立主格</h3>
<p>with + 宾语 + doing（主动进行）/ done（被动完成）/ to do（将来）。With winter coming on, leaves turn yellow.</p>
<div class="notice warn">感官动词宾补：see sb do（看见全过程）/ see sb doing（正在做）/ see sb done（被动）。变成被动时 do 的 to 要还原：sb was seen to do。</div>`,
quiz:[
{q:"The problems ___ (discuss) at the meeting tomorrow are very important.（用所给词的正确形式）",o:["discussing","discussed","to be discussed","to discuss"],a:2,ex:"tomorrow 表将来，problems 是“被讨论”，故选 to be discussed（不定式的被动式作定语）。"},
{q:"___ from the hill, the village looks more beautiful.",o:["Seeing","Seen","To see","See"],a:1,ex:"the village 是“被看”的，用过去分词 Seen（= When it is seen from the hill）。"},
{q:"He hurried to the station, ___ to meet his uncle.",o:["hope","hoped","hoping","to hope"],a:2,ex:"主语 he 主动“希望”，与 hurried 同时发生，用现在分词 hoping 作伴随状语。"},
{q:"I am looking forward to ___ your letter.",o:["receive","receiving","received","be received"],a:1,ex:"look forward to 的 to 是介词，后接 doing：looking forward to receiving。"},
]},
{name:"第8章 · 情态动词与虚拟语气",goal:"单选/语法填空中“看出语气”的能力",html:`
<h3>情态动词推测</h3>
<table class="tbl">
<tr><th>语气</th><th>现在</th><th>过去</th></tr>
<tr><td>肯定推测</td><td>must be（一定是）</td><td>must have done</td></tr>
<tr><td>否定推测</td><td>can't be（不可能）</td><td>can't have done</td></tr>
<tr><td>可能推测</td><td>may/might be</td><td>may/might have done</td></tr>
</table>
<h3>虚拟语气：把“假的”说出来</h3>
<table class="tbl">
<tr><th>情况</th><th>从句</th><th>主句</th></tr>
<tr><td>与现在相反</td><td>过去式（be用were）</td><td>would/could/might do</td></tr>
<tr><td>与过去相反</td><td>had done</td><td>would have done</td></tr>
<tr><td>与将来相反</td><td>did / should do / were to do</td><td>would do</td></tr>
</table>
<p><b>省略if倒装</b>：Were I you, I would try again.（= If I were you...）Had he known, he would have helped.（= If he had known...）</p>
<h3>其他虚拟场景</h3>
<p>wish：I wish I were a bird.（现在）/ I wish I had studied harder.（过去）<br>
I would rather (that)... did / had done。<br>
It is (high) time that... did / should do（早该）。<br>
without / but for / otherwise 暗含虚拟：Without your help, I would have failed.</p>
<div class="notice info">2025年四川一诊考过：It couldn't have been ___（不可能更糟了）——情态动词+完成时表对过去的推测。</div>`,
quiz:[
{q:"If I ___ you, I would take the chance.",o:["am","was","were","will be"],a:2,ex:"与现在相反的虚拟：从句用过去式，be 一律用 were。"},
{q:"—You missed the bus. —Yes. If I had left five minutes earlier, I ___ it.",o:["would catch","would have caught","will catch","had caught"],a:1,ex:"与过去相反的虚拟：从句 had done，主句 would have done。"},
{q:"He ___ have completed the work; I saw him working all morning.",o:["must","can't","may","needn't"],a:0,ex:"“看到他干了一早上”→“一定完成了”，肯定推测用 must have done。"},
{q:"I wish I ___ how to operate the machine.",o:["know","knew","had known","would know"],a:1,ex:"wish 表对现在的愿望：从句用一般过去时 knew（wish I knew = 真希望我现在懂）。"},
]},
{name:"第9章 · 倒装与强调",goal:"语法填空压轴常客：否定词前置倒装+强调句型",html:`
<h3>部分倒装（把助动词/系动词/情态提前）</h3>
<p>1. <b>否定词置于句首</b>：never, hardly, seldom, little, rarely, no sooner, not only, not until...<br>
2. <b>only + 状语（从句/介词短语/副词）</b>置于句首：Only then did I realize...<br>
3. <b>so/neither 引导“也/也不”</b>：So do I. / Neither can he.<br>
4. <b>so...that 中 so 提前</b>：So loudly did he speak that...<br>
5. 省略 if 的虚拟：Were I you...</p>
<h3>完全倒装（动词整个提前）</h3>
<p>here / there / out / in / away / up（表方向的副词）置于句首，主语是名词：Here comes the bus.（主语是代词则不倒装：Here it comes.）</p>
<h3>强调句型 It is/was...that...</h3>
<p>判断方法：<b>去掉 It is/was...that 看句子是否完整</b>。It was in 2008 that Beijing hosted the Olympics.（强调的是时间。注意强调人时可用 who：It was he who...）</p>
<div class="notice warn">高频陷阱：not until 的强调句 → It was not until midnight that he came back. 从句不倒装，主句（that后）保持正常语序。</div>`,
quiz:[
{q:"Never before ___ seen such a beautiful sunset.",o:["I have","have I","I had","had I"],a:3,ex:"Never 置于句首，部分倒装，且 seen 提示完成时，“从未见过”与现在对比，had I 构成“过去的过去”亦可。标准结构：Never before had I seen（在此之前从未见过）。"},
{q:"Only when he told me ___ the truth.",o:["I knew","did I know","I did know","knew I"],a:1,ex:"only + 时间状语从句置于句首，主句部分倒装：did I know。"},
{q:"It was at the very beginning ___ our teacher made the suggestion.",o:["when","where","that","which"],a:2,ex:"强调句型 It was...that...，被强调部分是 at the very beginning。"},
{q:"—I have never been to Tibet. —___.",o:["So have I","Neither have I","So I have","Neither I have"],a:1,ex:"“我也没有”用 Neither/Nor + 倒装：Neither have I。So have I 表示“我也是”。"},
]},
{name:"第10章 · 主谓一致",goal:"语法填空隐形考点：看名词不看距离",html:`
<h3>三大原则</h3>
<table class="tbl">
<tr><th>原则</th><th>例句</th></tr>
<tr><td><b>语法一致</b>（看单复数）</td><td>Two boys are playing.</td></tr>
<tr><td><b>意义一致</b>（集体名词）</td><td>My family is large.（整体）/ My family are watching TV.（个体）</td></tr>
<tr><td><b>就远一致</b>（A or B）</td><td>Either you or he is right.</td></tr>
</table>
<h3>必背细则</h3>
<p>1. <b>就远一致</b>：or / either...or / neither...nor / not only...but also / there be 多个主语 → 动词与最近的主语一致。<br>
2. <b>就前一致</b>：as well as / together with / along with / with / except / but / including → 动词与前面主语一致：He, as well as his friends, is coming.<br>
3. <b>不定式/动名词/从句</b>作主语 → <b>谓语单数</b>：To learn English is important.<br>
4. <b>a number of + 复数名词</b> → 复数；<b>the number of + 复数名词</b> → 单数。<br>
5. <b>many a / more than one + 单数名词</b> → 单数谓语。<br>
6. <b>quantities of + 可数/不可数</b> → 复数谓语。<br>
7. <b>分数/百分数 + of + 名词</b> → 看名词单复数。<br>
8. <b>and 连接同一人/物</b>（the writer and teacher）→ 单数；不同人 → 复数。</p>
<div class="notice warn">2025年四川一诊语法填空考过 specializes——主语为第三人称单数、一般现在时，动词加 -es。</div>`,
quiz:[
{q:"Either you or your brother ___ to attend the meeting.",o:["have","has","are","is having"],a:1,ex:"either...or 就远一致，与最近的 brother（三单）一致，用 has。"},
{q:"The number of the students in our school ___ over 3,000.",o:["are","is","were","have been"],a:1,ex:"the number of + 名词，谓语用单数 is。"},
{q:"Tom, together with his classmates, ___ playing football now.",o:["are","is","were","am"],a:1,ex:"together with 就前一致，与 Tom 一致，用 is。"},
{q:"Quantities of milk ___ on the table every morning.",o:["is","are","was","has been"],a:1,ex:"quantities of + 名词，无论可不可数，谓语都用复数 are。"},
]},
];

function doCheckin(){
  const t=today(), y=new Date(Date.now()-86400000).toDateString();
  if(!S.checkins.includes(t)) S.checkins.push(t);
  if(S.lastCheckin===y){ S.streak=(S.streak||0)+1; }
  else if(S.lastCheckin!==t){ S.streak=1; }
  S.lastCheckin=t; save();
  showView('home');
}

/* ---------- 单元测 ---------- */
function startUnitQuiz(){
  const list=curUnit<0?PHRASES:VOCAB[curUnit].words;
  const pool=allWords().map(w=>w.w).concat(PHRASES.map(w=>w.w));
  const picked=list.sort(()=>Math.random()-.5).slice(0,Math.min(8,list.length));
  unitQuizState={qs:picked.map(w=>({m:w.m,a:w.w,wid:w.id})), opts:{}, i:0, wrong:[]};
  picked.forEach(w=>{
    const dis=shuffle(pool.filter(x=>x!==w.w)).slice(0,3);
    unitQuizState.qs.find(q=>q.wid===w.id).o=shuffle([w.w,...dis]);
  });
  render();
}
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function vQuiz(){
  const q=unitQuizState;
  if(q.i>=q.qs.length){
    const right=q.qs.length-q.wrong.length;
    S.unitQuiz[curUnit<0?'phrase':'u'+curUnit]={score:right,total:q.qs.length,date:today()};
    q.wrong.forEach(id=>S.wrong[id]=1); save();
    return `<div class="card"><h2>📝 单元测结果</h2>
      <h1 style="font-size:38px;color:${right>=q.qs.length*0.85?'var(--green)':'var(--amber)'}">${right}/${q.qs.length}</h1>
      <p class="muted">${right===q.qs.length?'满分！可以进入下一单元了':right>=q.qs.length*0.6?'不错，错题已进生词本':'错题较多，建议回到闪卡再过一遍'}</p>
      <div style="margin-top:10px; display:flex; gap:10px; flex-wrap:wrap;">
        <button class="btn" onclick="startUnitQuiz()">再测一次</button>
        <button class="btn ghost" onclick="unitQuizState=null;render()">返回词书</button></div></div>`;
  }
  return `<div class="card"><h2>📝 单元测 <span class="muted" style="font-weight:400">${q.i+1}/${q.qs.length}</span></h2>
    <div class="q-box"><div class="qt">下面哪个单词表示：<b>${q.qs[q.i].m}</b></div>
    ${q.qs[q.i].o.map(o=>{
      const sel=q.opts[q.i]===o;
      const answered=q.opts[q.i]!==undefined;
      let cls='';
      if(answered){ cls = o===q.qs[q.i].a?'correct':(sel?'wrong':''); }
      return `<button class="opt ${cls} ${answered?'done':''}" onclick="pickQuiz('${o.replace(/'/g,"\\'")}')">${o}</button>`;
    }).join('')}
    <div class="explain" style="display:${q.opts[q.i]!==undefined?'block':'none'}">
      ${q.opts[q.i]!==undefined?(q.opts[q.i]===q.qs[q.i].a?'✅ 回答正确':'❌ 正确答案：<b>'+q.qs[q.i].a+'</b>'):''}
    </div></div>
    ${q.opts[q.i]!==undefined?`<button class="btn" style="margin-top:10px" onclick="unitQuizState.i++;render()">下一题 →</button>`:''}
  </div>`;
}
function pickQuiz(o){
  const q=unitQuizState; if(q)q.opts[q.i]=o;
  if(o!==q.qs[q.i].a && !q.wrong.includes(q.qs[q.i].wid)) q.wrong.push(q.qs[q.i].wid);
  render();
}

function pastSetById(id){ return PAST.find(p=>p.id===id); }
function pickOpt(qi,oi){ if(pastGraded) return; pastAns[qi]=oi; render(); }
function fillAns(qi,v){ if(pastGraded) return; pastAns[qi]=v; }
function escA(s){ return String(s==null?'':s).replace(/"/g,'&quot;').replace(/&/g,'&amp;'); }
const normA=s=>String(s==null?'':s).toLowerCase().replace(/[.,!?;:"'()]/g,'').replace(/\s+/g,' ').trim();
function pastCheck(q,u){
  if(u==null) return false;
  const cand=q.opts?['ABCD'[u],q.opts[u]]:[u];
  return cand.some(c=>q.a.some(a=>normA(c)===normA(a)));
}
function gradePast(){
  const p=pastSetById(pastSet); if(!p||!p.qs) return;
  let right=0;
  p.qs.forEach((q,i)=>{ if(pastCheck(q,pastAns[i])) right++; });
  p.qs.forEach((q,i)=>{ if(pastCheck(q,pastAns[i])) delete S.pastWrong[p.id+'_'+i]; else S.pastWrong[p.id+'_'+i]=1; });
  const prev=S.past[p.id]||{best:0,count:0};
  S.past[p.id]={best:Math.max(prev.best,right),last:right,count:prev.count+1};
  pastGraded=true; save(); render(); window.scrollTo({top:0});
}

        <h3>${e.t}</h3>
        <div class="pq-req">${e.req.replace(/\n/g,'<br>')}</div>
        <div style="margin-top:8px">${e.tips.map((t,i)=>`<div class="pq-tip">${i+1}. ${t}</div>`).join('')}</div>
        <div class="sc-ex" style="margin-top:8px"><div class="sc-ex-head"><span class="sc-ex-lab">参考范文</span></div>
          <div class="sc-ex-en" style="white-space:pre-wrap">${e.sample}</div></div>
      </div>`).join('')}
    <div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn ${rec.count?'gray':''}" onclick="markEssay()">${rec.count?'✓ 已标记学过':'✅ 读完范文，标记学会'}</button>
      <button class="btn ghost" onclick="pastSet=null;render()">← 返回真题列表</button>
    </div>`;
  }else{
    body=`
    ${p.passage?`<div class="card" style="margin-top:10px;box-shadow:none"><h3>📄 真题原文</h3><div class="pq-passage">${p.passage}</div></div>`:''}
    ${pastGraded?`<div class="card" style="margin-top:10px;box-shadow:none;border-color:var(--green)">
      <h3>📊 本次得分</h3>
      <div style="font-size:22px;font-weight:700;color:${rec.last>=n?'var(--green)':'var(--amber)'}">${rec.last} / ${n} 分 ${rec.last>=n?'🎉 全对，稳！':''}</div>
      <p class="muted">已练 ${rec.count} 次 · 历史最好 ${rec.best}/${n}${rec.best<n?' · 错的题往下看逐题解析，搞懂再点「重做一次」':''}</p>
      <div style="margin-top:8px;display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn" onclick="retryPast()">↻ 重做一次</button>
        <button class="btn ghost" onclick="pastSet=null;render()">← 返回真题列表</button>
      </div></div>`:''}
    <div class="card" style="margin-top:10px;box-shadow:none">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <h3>📋 题目（${n}）</h3>
        ${pastGraded?'':`<button class="btn green" onclick="gradePast()">提交答卷（已答 ${ansN}/${n}）</button>`}
      </div>
      ${p.qs.map((q,i)=>{
        const ok=pastGraded?pastCheck(q,pastAns[i]):null;
        const kp=q.kp?`<span class="pq-kp">${q.kp}</span>`:'';
        const head=q.n!=null?`<span class="tag b">第${q.n}题</span>`:'';
        let ctrl='';
        if(q.opts){
          ctrl=`<div class="pq-opts">${q.opts.map((o,oi)=>{
            const isAns=q.opts[oi]&&q.a.some(a=>normA(a)===normA('ABCD'[oi])||normA(a)===normA(o));
            const cls=pastGraded?(isAns?'ok':(pastAns[i]===oi?'no':'')):(pastAns[i]===oi?'sel':'');
            return `<button class="opt ${cls}" onclick="pickOpt(${i},${oi})">${'ABCD'[oi]}. ${o}</button>`;
          }).join('')}</div>`;
        }else{
          ctrl=`<input class="fill" value="${escA(pastAns[i]||'')}" ${pastGraded?'disabled':''} oninput="fillAns(${i},this.value)" placeholder="输入答案（英文，注意大小写）">`;
        }
        const exp=pastGraded?`<div class="pq-exp ${ok?'':'no'}">${ok?'✅ 回答正确':'❌ 正确答案：<b>'+q.a[0]+'</b>'} ｜ 💡 解析：${q.exp}</div>`:'';
        return `<div class="pq"><div class="pq-h">${head}${kp}</div><div class="pq-q">${q.q}</div>${ctrl}${exp}</div>`;
      }).join('')}
      ${pastGraded?'':`<div style="margin-top:10px"><button class="btn green" onclick="gradePast()">提交答卷（已答 ${ansN}/${n}）</button></div>`}
    </div>`;
  }
  return `<div class="card">
    <h2>${p.title}</h2>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">
      <span class="tag p">${p.year}年·${p.paper}</span><span class="tag b">${PAST_COL[p.col]}</span>
      <span class="tag ${rec.count?'g':'r'}">${rec.count?(p.essay?'已学':'已练'+rec.count+'次'):'未开始'}</span>
    </div>
    <p class="muted">${p.desc}</p>
    <div style="margin-top:8px"><button class="btn ghost" onclick="pastSet=null;render()">← 返回真题列表</button></div>
    ${body}
  </div>`;
}

/* ==================== 渲染入口 ==================== */
let wrongFlag=false;
function render(){
  let html='';
  if(study) html=vStudyCard();
  else if(unitQuizState) html=vQuiz();
  else if(unitListView!==null&&curView==='vocab'&&!wrongFlag) html=vUnitList(unitListView);
  else if(curView==='home') html=vHome();
  else if(curView==='res') html=vRes();
  else if(curView==='vocab') html=wrongFlag?vWrong():vVocab();
  else if(curView==='grammar') html=(gOpen!==null)?vGOpen():vGrammar();
  else if(curView==='read') html=(rOpen!==null)?vROpen():vRead();
  else if(curView==='write') html=vWrite();
  else if(curView==='past') html=pastSet?vPastSet():vPast();
  else if(curView==='policy') html=vPolicy();
  else if(curView==='set') html=vSet();
  $('#view').innerHTML=html;
  renderTabs();
}
render();
</script>
</body>
</html>
